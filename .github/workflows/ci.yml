# e04 — .github/workflows/ci.yml
# ================================
# Pipeline de CI para o Bella Tavola
#
# Exercícios cobertos:
#   e04_p01, ex 2.3 — primeiro workflow (job verificar-api com curl)
#   e04_p01, ex 2.4 — dois jobs dependentes (verificar-sintaxe + verificar-api)
#   e04_p02, ex 3.x — pytest com TestClient (job testes-smoke)
#   e04_p03, ex 5.x — testes de integração com HF_TOKEN e cache
#
# Estrutura de jobs:
#   testes-smoke ──── roda em todo push/PR → sem secrets, sem modelo
#   testes-integracao ── só no merge para main → requer HF_TOKEN, baixa modelo
#
# Para refletir (ex 2.4):
#   Por que separar verificar-sintaxe de verificar-api?
#   Se o código tem import não usado, há um erro de qualidade;
#   não faz sentido gastar tempo subindo a API antes de corrigir isso.
#   Separar em jobs permite feedback rápido e isolado.

name: CI — Bella Tavola

defaults:
  run:
    working-directory: e04_ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Verificar sintaxe e formatação
  # (ex 2.4 do e04_p01: job que roda antes de verificar-api)
  # ---------------------------------------------------------------------------
  verificar-sintaxe:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de qualidade
        run: pip install autoflake black

      - name: Verificar imports não utilizados
        run: autoflake --check --remove-all-unused-imports -r .
        # Falha o pipeline se houver imports não usados.
        # Imports não usados indicam código desnecessário ou esquecimento de limpeza.

      - name: Verificar formatação com black
        run: black --check .
        # Falha se o código não estiver formatado com black.
        # Formatação consistente elimina ruído nos diffs do Git.

  # ---------------------------------------------------------------------------
  # JOB 2: Verificar que a API sobe e responde
  # (ex 2.3 do e04_p01: curl smoke test)
  # (ex 2.4: depende do job anterior via needs:)
  # ---------------------------------------------------------------------------
  verificar-api:
    runs-on: ubuntu-latest
    needs: verificar-sintaxe   # só roda se verificar-sintaxe passar

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar a API em background
        run: |
          uvicorn main:app &
          sleep 5
          # '&' coloca o processo em background — o terminal fica livre para o próximo step.
          # sleep 5 dá tempo para a API inicializar antes do curl.
          # Se sua API carrega modelo na inicialização, aumente para sleep 15.

      - name: Verificar que a API responde na rota raiz
        run: |
          curl --fail http://localhost:8000/
          echo "✅ API respondeu com sucesso"
          # --fail: retorna exit code != 0 se a resposta for 4xx ou 5xx,
          # fazendo o pipeline falhar corretamente em vez de continuar.

  # ---------------------------------------------------------------------------
  # JOB 3: Testes automatizados com pytest (smoke tests)
  # (ex 3.x do e04_p02: TestClient, sem precisar subir servidor real)
  # ---------------------------------------------------------------------------
  testes-smoke:
    runs-on: ubuntu-latest
    needs: verificar-api   # só roda se a API subiu corretamente

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes smoke
        run: python -m pytest tests/ -m smoke -v --tb=short
        # -m smoke: executa apenas testes marcados com @pytest.mark.smoke
        # -v: verbose — mostra nome de cada teste
        # --tb=short: traceback resumido nos logs do pipeline

  # ---------------------------------------------------------------------------
  # JOB 4: Testes de integração com modelo do Hugging Face Hub
  # (ex 5.x do e04_p03: HF_TOKEN via secret, cache, testes @pytest.mark.integracao)
  # Só roda em push para main (não em PRs de forks — segurança)
  # ---------------------------------------------------------------------------
  testes-integracao:
    runs-on: ubuntu-latest
    needs: testes-smoke
    if: github.ref == 'refs/heads/main'
    # Condição: só executa quando o push é diretamente para main.
    # PRs de forks NÃO têm acesso a secrets — rodá-los aí causaria falhas.

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Cache do Hugging Face (ex 5.4 — reduz tempo de download em execuções seguintes)
      - name: Cache do modelo Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # A chave combina:
          # - versão manual do modelo ('v1') — mude para 'v2' ao publicar novo modelo
          # - hash do requirements.txt — invalida se as dependências mudarem
          key: hf-model-v1-${{ hashFiles('requirements.txt') }}
        # Reflexão (ex 5.4): se publicar nova versão do modelo no Hub,
        # o pipeline vai continuar usando o cache antigo até você mudar 'v1' → 'v2'.
        # O hashFiles sozinho não é suficiente porque ele monitora o requirements.txt,
        # não o artefato .pkl no Hub.

      - name: Rodar testes de integração
        run: python -m pytest tests/ -m integracao -v --tb=short
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # O secret HF_TOKEN é configurado em:
          # GitHub → seu repo → Settings → Secrets and variables → Actions → New secret
          # Nome exato: HF_TOKEN
          # Valor: token gerado em https://huggingface.co/settings/tokens
          #
          # NUNCA exponha o valor do token em outputs de echo ou print —
          # o GitHub mascarará automaticamente o valor nos logs.
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}

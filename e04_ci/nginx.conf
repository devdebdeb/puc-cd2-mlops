# e05_p02 (Exercício 11.3) — Nginx como proxy reverso da Bella Tavola
# Único ponto de entrada público (porta 80). Repassa para o serviço 'api'
# na rede interna do Compose. O 'api' deixa de ser exposto direto ao host.

server {
    listen 80;

    location / {
        # 'api' é resolvido pelo DNS interno do Docker Compose para o
        # contêiner da API, na porta 8000 onde o uvicorn escuta.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /ml/predict pode demorar na 1a chamada (download do modelo do HF):
        proxy_read_timeout 120s;
    }
}

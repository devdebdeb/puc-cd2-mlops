[pytest]
# Registra os marcadores customizados para evitar PytestUnknownMarkWarning
markers =
    smoke: Testes essenciais que rodam em todo push e pull request
    integracao: Testes que requerem o modelo do Hugging Face Hub (HF_TOKEN necessário)
    validacao: Testes focados em validação de entrada e regras de negócio
